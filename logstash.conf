input {
  tcp {
    port  => 5044
    codec => "line"
  }
}

filter {
  mutate {
    add_field => { "log_to_encrypt" => "FortiGate: %{message}" }
  }

  cipher {
    source           => "log_to_encrypt"
    target           => "encrypted_message"
    algorithm        => "AES-256-CBC"
    key              => "12345678901234567890123456789012"
    iv_random_length => 16
    base64           => true
    encrypt          => true
  }
}

output {
  stdout { codec => rubydebug }

  file {
    path  => "/var/log/logstash/outputlogs/Syslog-encrypted-%{+yyyy-MM-dd}.log"
    codec => line { format => "%{encrypted_message}" }
  }
    file {
    path => "/var/log/logstash/outputlogs/Syslog-%{+yyyy-MM-dd}.log"
    codec => line { format => "Testlog: %{message}" }
  }
}
